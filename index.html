  const left=miss();if(!left)break;const stuck=prev>=0&&left>=prev;if(stuck){if(++fails>=3)break}else fails=0;if(stuck||S.err){S.busy=`ממתין ומנסה שוב… נשארו ${left}`;render();await new Promise(r=>setTimeout(r,4000))}prev=left}

function mk(pool,all){const sh=a=>[...a].sort(()=>Math.random()-.5);const qs=[];
 sh(pool).slice(0,10).forEach(w=>{const ty=sh(['tr','he','def','cl'].filter(t=>t=='tr'&&w.t||t=='he'&&w.t||t=='def'&&w.def||t=='cl'&&w.ex&&new RegExp(rx(w.w),'i').test(w.ex)))[0];if(!ty)return;
  const key=ty=='tr'?'t':'w';let opts=sh(all.filter(x=>x.w!=w.w&&x[key]&&x[key]!=w[key]));const seen=new Set([w[key]]);opts=opts.filter(x=>!seen.has(x[key])&&seen.add(x[key])).slice(0,3).map(x=>x[key]);
  if(opts.length<3)return;const ans=ty=='tr'?w.t:w.w;let pr;
  if(ty=='tr')pr=`<div class="mu">מה התרגום של המילה?</div><div class="big en">${esc(w.w)}</div>`;
  if(ty=='he')pr=`<div class="mu">איזו מילה באנגלית מתאימה?</div><div class="big">${esc(w.t)}</div>`;
  if(ty=='def')pr=`<div class="mu">איזו מילה מתאימה להגדרה?</div><div class="big en" style="font-size:20px">${esc(w.def)}</div>`;
  if(ty=='cl')pr=`<div class="mu">השלם את המשפט</div><div class="big en" style="font-size:20px">${esc(w.ex.replace(new RegExp(rx(w.w),'ig'),'_____'))}</div>`;
  qs.push({w,pr,ans,o:sh([ans,...opts]),en:ty!='tr'})});return qs}
function start(pool){const all=words().filter(w=>w.t);pool=pool.filter(w=>w.t||w.def);const qs=mk(pool,all);if(!qs.length)return toast('אין מספיק מילים עם תרגום/הגדרה. השלם עם AI או הוסף עוד מילים (מינימום 4).');S.a={qs,i:0,sc:0,done:null};S.v='quiz';render()}
function pick(k){const a=S.a,q=a.qs[a.i];if(a.done!=null)return;a.done=k;const ok=q.o[k]==q.ans;if(ok)a.sc++;
 const p=S.P.p[q.w.w]||[0,0];const lv=ok?Math.min(5,p[0]+1):0;S.P.p[q.w.w]=[lv,day()+INT[lv]];say(q.w.w);render()}
